services:
  # ----------------------------------------------------------------------------
  # Data Stores & Messaging Infrastructure
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: btf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}) }'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: btf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: btf-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Python Data Ingestion & AI Extraction Services
  # ----------------------------------------------------------------------------
  scraper-api:
    build:
      context: ./services/scraper-service
      dockerfile: Dockerfile
    container_name: btf-scraper-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-true}
      - CORE_SERVICE_URL=http://core-service:8081
    depends_on:
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./services/scraper-service
      dockerfile: Dockerfile
    container_name: btf-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "src.tasks.celery_app.app", "worker", "--loglevel=info", "-Q", "scrapes,extraction"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock}
      - USE_MOCK_DATA=${USE_MOCK_DATA:-true}
      - CORE_SERVICE_URL=http://core-service:8081
    depends_on:
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Java Spring Boot Core & Event Dispatcher Service
  # ----------------------------------------------------------------------------
  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: btf-core-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/badminton_db?replicaSet=rs0
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Spring Cloud Gateway (WebFlux Netty Reactive Engine)
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: btf-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - CORE_SERVICE_URL=http://core-service:8081
      - SCRAPER_SERVICE_URL=http://scraper-api:8000
    depends_on:
      core-service:
        condition: service_started
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # React + MUI Frontend
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: btf-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8080
      - VITE_WS_GATEWAY_URL=ws://localhost:8080/ws
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  mongo_data:
  redis_data:
  kafka_data:

