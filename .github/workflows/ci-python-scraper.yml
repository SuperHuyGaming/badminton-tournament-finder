name: Python Scraper & AI CI

on:
  push:
    branches: [main]
    paths:
      - 'services/scraper-service/**'
      - 'packages/contracts/**'
      - '.github/workflows/ci-python-scraper.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/scraper-service/**'
      - 'packages/contracts/**'
      - '.github/workflows/ci-python-scraper.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: services/scraper-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov httpx fastapi celery redis pydantic instructor openai beautifulsoup4

      - name: Lint and Format Check (ruff)
        working-directory: services/scraper-service
        run: |
          ruff check .
          ruff format --check .

      - name: Run Unit Tests with Pytest
        working-directory: services/scraper-service
        env:
          REDIS_URL: redis://localhost:6379/0
          USE_MOCK_DATA: "true"
          OPENAI_API_KEY: "mock-key-for-tests"
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

