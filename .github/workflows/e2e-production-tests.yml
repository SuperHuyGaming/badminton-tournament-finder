name: Production E2E Tests (Playwright)

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to run E2E tests against'
        required: true
        default: 'https://badmintonfinder.org'

jobs:
  e2e-tests:
    name: Run Cross-Browser Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/e2e/package.json

      - name: Install Test Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        working-directory: tests/e2e
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: ${{ github.event.inputs.target_url || 'https://badmintonfinder.org' }}
          CI: true
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-report
          path: tests/e2e/playwright-report/
          retention-days: 14
