name: Contracts & API Schema CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/ci-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/ci-contracts.yml'

jobs:
  validate-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI Specifications with Spectral
        run: |
          npx @stoplight/spectral-cli lint packages/contracts/openapi/*.yaml

      - name: Validate AsyncAPI Specifications
        run: |
          npx @asyncapi/cli validate packages/contracts/asyncapi/*.yaml

