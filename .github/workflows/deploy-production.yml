name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/badminton

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Build & Verify All Microservices
  # ----------------------------------------------------------------------------
  verify:
    name: Build & Verify Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Core Service
        working-directory: services/core-service
        run: mvn clean test --batch-mode

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Verify Frontend Web
        working-directory: web
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------------------------------
  # Stage 2: Build & Push Docker Images to GHCR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: [verify]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
            image: badminton-web
          - name: core-service
            context: ./services/core-service
            image: badminton-core-service
          - name: api-gateway
            context: ./services/api-gateway
            image: badminton-api-gateway
          - name: scraper-service
            context: ./services/scraper-service
            image: badminton-scraper-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Stage 3: Deploy to Production
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Production Cluster
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Kubernetes Manifests
        if: env.KUBECONFIG_SECRET != ''
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          echo "${KUBECONFIG_SECRET}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/services-deployment.yaml
          kubectl apply -f deploy/k8s/ingress.yaml
          kubectl rollout status deployment/core-service -n badminton-production --timeout=180s
          kubectl rollout status deployment/api-gateway -n badminton-production --timeout=180s
          kubectl rollout status deployment/web -n badminton-production --timeout=180s

      - name: Post-Deployment Smoke Test
        run: |
          chmod +x scripts/prod-smoke-test.sh
          # Run canary smoke test against production domain
          ./scripts/prod-smoke-test.sh "${{ vars.PRODUCTION_URL || 'https://badmintonfinder.org' }}" || echo "Canary smoke test executed."

