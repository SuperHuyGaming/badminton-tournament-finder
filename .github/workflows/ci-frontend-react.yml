name: Frontend React CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/contracts/**'
      - '.github/workflows/ci-frontend-react.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/contracts/**'
      - '.github/workflows/ci-frontend-react.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck (tsc)
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        working-directory: web
        run: npm run lint

      - name: Run Unit Tests
        working-directory: web
        run: npm run test:run

      - name: Build Production Bundle
        working-directory: web
        run: npm run build

