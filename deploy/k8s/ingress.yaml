apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: badminton-ingress
  namespace: badminton-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway"
spec:
  tls:
    - hosts:
        - badmintonfinder.org
        - www.badmintonfinder.org
      secretName: badmintonfinder-tls-cert
  rules:
    - host: badmintonfinder.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
