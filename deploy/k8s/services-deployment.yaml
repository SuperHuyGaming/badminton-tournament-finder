# ------------------------------------------------------------------------------
# Core Backend Service (Java Spring Boot 3.3)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: badminton-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: ghcr.io/badmintonfinder/badminton-core-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: btf-production-secrets
            - configMapRef:
                name: btf-production-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: badminton-production
spec:
  selector:
    app: core-service
  ports:
    - port: 8081
      targetPort: 8081
---
# ------------------------------------------------------------------------------
# API Gateway (Spring Cloud Gateway WebFlux)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: badminton-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/badmintonfinder/badminton-api-gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: btf-production-secrets
            - configMapRef:
                name: btf-production-config
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: badminton-production
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
# ------------------------------------------------------------------------------
# Frontend (React + MUI Static Nginx)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: badminton-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/badmintonfinder/badminton-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: badminton-production
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80

